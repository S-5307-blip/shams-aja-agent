name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: التحقق من صياغة وكيل واتساب
        run: node --check src/server.js && node --check src/agent.js
      - name: اختبارات وكيل العمليات (نموذج محاكى، بلا مفاتيح)
        run: npm test
